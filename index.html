        </button>

            Spela upp
        </div>

    <audio id="recording" preload="auto">
        <source
            src="secret-recording.mp3"
            type="audio/mpeg">
    </audio>

</div>

<script>

    const audio = document.getElementById("recording");
    const button = document.getElementById("playButton");
    const waveform = document.getElementById("waveform");
    const label = document.getElementById("buttonLabel");

    button.addEventListener("click", function () {

        if (audio.paused) {

            audio.play();

            button.classList.add("playing");
            waveform.classList.add("playing");
            label.textContent = "Paus";

        } else {

            audio.pause();

            button.classList.remove("playing");
            waveform.classList.remove("playing");
            label.textContent = "Spela upp";

        }

    });

    audio.addEventListener("ended", function () {

        button.classList.remove("playing");
        waveform.classList.remove("playing");
        label.textContent = "Spela upp igen";

    });

</script>
