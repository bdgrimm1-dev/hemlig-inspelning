<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no,
               viewport-fit=cover">

<title>Margaretas iPhone</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
}

body {
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Helvetica Neue",
        Arial,
        sans-serif;

    color: #fff;
    overflow: hidden;

    -webkit-user-select: none;
    user-select: none;
}


/* MAIN SCREEN */

.phone {
    width: 100%;
    height: 100dvh;

    min-height: 520px;

    display: flex;
    flex-direction: column;

    padding-top: max(52px, env(safe-area-inset-top));
    padding-left: 22px;
    padding-right: 22px;
    padding-bottom: max(28px, env(safe-area-inset-bottom));

    background:
        radial-gradient(
            ellipse at 50% 45%,
            #1c1c1e 0%,
            #101011 35%,
            #050505 70%,
            #000000 100%
        );
}


/* HEADER */

.header {
    width: 100%;
    text-align: center;
}

.device {
    font-size: 15px;
    font-weight: 500;
    color: #f2f2f7;
    margin-bottom: 9px;
}

.title {
    font-size: clamp(25px, 7vw, 30px);
    font-weight: 400;
    letter-spacing: -0.7px;
    margin-bottom: 8px;
}

.date {
    color: #8e8e93;
    font-size: 14px;
    font-weight: 400;
}


/* CENTER */

.content {
    flex: 1;

    width: 100%;
    max-width: 500px;

    margin: 0 auto;

    display: flex;
    flex-direction: column;

    justify-content: center;
    align-items: center;
}


/* ANIMATED WAVEFORM */

.waveform-container {
    width: 100%;
    max-width: 390px;

    height: 100px;

    display: flex;
    align-items: center;
    justify-content: center;

    position: relative;

    margin-bottom: 25px;

    overflow: hidden;
}

.waveform {
    width: 100%;
    height: 100%;

    display: flex;
    align-items: center;
    justify-content: center;

    gap: 3px;
}

.bar {
    width: 3px;

    background: rgba(80, 170, 220, 0.42);

    border-radius: 5px;

    opacity: 0.65;

    transform-origin: center;

    transition:
        background 0.25s ease,
        opacity 0.25s ease;
}


/*
    The waveform is deliberately NOT connected
    to the timeline. It is purely visual, so
    scrubbing continues to work independently.
*/

.waveform.playing .bar {
    animation: waveformPulse 0.9s ease-in-out infinite alternate;
}


/* Different animation speeds make it feel organic */

.waveform.playing .bar:nth-child(2n) {
    animation-duration: 0.72s;
}

.waveform.playing .bar:nth-child(3n) {
    animation-duration: 1.05s;
}

.waveform.playing .bar:nth-child(4n) {
    animation-duration: 0.82s;
}

.waveform.playing .bar:nth-child(5n) {
    animation-duration: 1.18s;
}


@keyframes waveformPulse {

    0% {
        transform: scaleY(0.35);
        opacity: 0.35;
    }

    50% {
        transform: scaleY(0.85);
        opacity: 0.55;
    }

    100% {
        transform: scaleY(1.15);
        opacity: 0.75;
    }

}


/* Individual starting heights */

.bar:nth-child(1)  { height: 20px; }
.bar:nth-child(2)  { height: 34px; }
