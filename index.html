<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no,
               viewport-fit=cover">

<title>Margaretas iPhone</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
}

body {
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Helvetica Neue",
        Arial,
        sans-serif;

    color: #fff;

    overflow: hidden;

    -webkit-user-select: none;
    user-select: none;
}

/* MAIN SCREEN */

.phone {
    width: 100%;
    height: 100dvh;

    min-height: 520px;

    display: flex;
    flex-direction: column;

    padding-top: max(52px, env(safe-area-inset-top));
    padding-left: 22px;
    padding-right: 22px;
    padding-bottom: max(28px, env(safe-area-inset-bottom));

    background:
        radial-gradient(
            ellipse at 50% 45%,
            #1c1c1e 0%,
            #101011 35%,
            #050505 70%,
            #000000 100%
        );
}

/* TOP INFORMATION */

.header {
    width: 100%;
    text-align: center;
}

.device {
    font-size: 15px;
    font-weight: 500;

    color: #f2f2f7;

    margin-bottom: 9px;
}

.title {
    font-size: clamp(25px, 7vw, 30px);
    font-weight: 400;

    letter-spacing: -0.7px;

    margin-bottom: 8px;
}

.date {
    color: #8e8e93;

    font-size: 14px;
    font-weight: 400;
}

/* CENTER CONTENT */

.content {
    flex: 1;

    width: 100%;
    max-width: 500px;

    margin: 0 auto;

    display: flex;
    flex-direction: column;

    justify-content: center;
    align-items: center;
}

/* WAVEFORM */

.waveform-container {
    width: 100%;
    max-width: 390px;

    height: 100px;

    display: flex;
    align-items: center;

    position: relative;

    margin-bottom: 25px;

    overflow: hidden;
}

.waveform {
    width: 100%;
    height: 100%;

    display: flex;
    align-items: center;
    justify-content: center;

    gap: 3px;
}

.bar {
    flex: 1;

    max-width: 4px;

    min-width: 2px;

    background: #666;

    border-radius: 4px;

    transition:
        background 0.1s linear,
        opacity 0.1s linear;

    opacity: 0.7;
}

/* PLAYED WAVEFORM */

.bar.played {
    background: #f2f2f7;
    opacity: 1;
}

/* TIMELINE */

.timeline {
    width: 100%;
    max-width: 390px;

    height: 30px;

    position: relative;

    display: flex;
    align-items: center;

    margin-bottom: 18px;
}

.track {
    position: absolute;

    left: 0;
    right: 0;

    height: 4px;

    background: #3a3a3c;

    border-radius: 5px;
}

.progress {
    position: absolute;

    left: 0;

    height: 4px;

    width: 0%;

    background: #f2f2f7;

    border-radius: 5px;
}

.scrubber {
    position: absolute;

    width: 22px;
    height: 22px;

    left: 0%;

    transform: translateX(-50%);

    border-radius: 50%;

    background: #fff;

    box-shadow:
        0 1px 5px rgba(0,0,0,0.5);

    pointer-events: none;
}

/* TIME */

.times {
    width: 100%;
    max-width: 390px;

    display: flex;
    justify-content: space-between;

    color: #8e8e93;

    font-size: 12px;

    margin-bottom: 38px;
}

/* AUDIO CONTROLS */

.controls {
    display: flex;

    align-items: center;
    justify-content: center;

    gap: 38px;
}

/* RESTART BUTTON */

.restart {
    width: 52px;
    height: 52px;

    border: none;

    border-radius: 50%;

    background: rgba(255,255,255,0.08);

    color: white;

    font-size: 21px;

    display: flex;
    align-items: center;
    justify-content: center;

    cursor: pointer;
}

.restart:active {
    transform: scale(0.93);

    background: rgba(255,255,255,0.15);
}

/* PLAY BUTTON */

.play-button {
    width: 76px;
    height: 76px;

    border: none;

    border-radius: 50%;

    background: #f2f2f7;

    display: flex;
    align-items: center;
    justify-content: center;

    cursor: pointer;

    box-shadow:
        0 4px 18px rgba(0,0,0,0.35);

    transition:
        transform 0.12s ease;
}

.play-button:active {
    transform: scale(0.93);
}

/* PLAY TRIANGLE */

.play-icon {
    width: 0;
    height: 0;

    border-top: 12px solid transparent;
    border-bottom: 12px solid transparent;

    border-left: 19px solid #111;

    margin-left: 5px;
}

/* PAUSE ICON */

.playing .play-icon {
    width: 18px;
    height: 23px;

    border: none;

    margin-left: 0;

    position: relative;
}

.playing .play-icon::before,
.playing .play-icon::after {
    content: "";

    position: absolute;

    top: 0;

    width: 6px;
    height: 23px;

    background: #111;

    border-radius: 2px;
}

.playing .play-icon::before {
    left: 0;
}

.playing .play-icon::after {
    right: 0;
}

/* BUTTON LABEL */

.button-label {
    margin-top: 18px;

    color: #8e8e93;

    font-size: 15px;

    min-height: 20px;
}

/* BOTTOM SPACE */

.bottom {
    height: 20px;
}

/* IPHONE PORTRAIT */

@media (max-width: 430px) {

    .phone {
        padding-left: 20px;
        padding-right: 20px;
    }

    .waveform-container,
    .timeline,
    .times {
        max-width: 100%;
    }

    .waveform-container {
        height: 85px;
    }

    .times {
        margin-bottom: 30px;
    }
}

/* VERY SMALL PHONES */

@media (max-height: 650px) {

    .phone {
        padding-top: max(38px, env(safe-area-inset-top));
    }

    .waveform-container {
        height: 65px;
        margin-bottom: 15px;
    }

    .times {
        margin-bottom: 20px;
    }

    .play-button {
        width: 66px;
        height: 66px;
    }

    .controls {
        gap: 28px;
    }
}

</style>
</head>


<body>

<div class="phone">

    <!-- HEADER -->

    <div class="header">

        <div class="device">
            Margaretas iPhone
        </div>

        <div class="title">
            Ny inspelning 3
        </div>

        <div class="date">
            2:48 – 21 sep 2026
        </div>

    </div>


    <!-- MAIN CONTENT -->

    <div class="content">

        <!-- WAVEFORM -->

        <div class="waveform-container">

            <div class="waveform" id="waveform">

                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>

            </div>

        </div>


        <!-- SCRUBBER -->

        <div class="timeline" id="timeline">

            <div class="track"></div>

            <div class="progress" id="progress"></div>

            <div class="scrubber" id="scrubber"></div>

        </div>


        <!-- TIME -->

        <div class="times">

            <span id="currentTime">
                0:00
            </span>

            <span>
                2:48
            </span>

        </div>


        <!-- CONTROLS -->

        <div class="controls">

            <button
                class="restart"
                id="restart"
                aria-label="Börja om">

                ↺

            </button>


            <button
                class="play-button"
                id="playButton"
                aria-label="Spela upp">

                <span class="play-icon"></span>

            </button>

        </div>


        <div
            class="button-label"
            id="buttonLabel">

            Spela upp

        </div>

    </div>


    <div class="bottom"></div>


    <!-- AUDIO FILE -->

    <audio
        id="recording"
        preload="metadata">

        <source
            src="secret-recording.mp3"
            type="audio/mpeg">

    </audio>

</div>


<script>

const audio =
    document.getElementById("recording");

const playButton =
    document.getElementById("playButton");

const restart =
    document.getElementById("restart");

const waveform =
    document.getElementById("waveform");

const bars =
    document.querySelectorAll(".bar");

const progress =
    document.getElementById("progress");

const scrubber =
    document.getElementById("scrubber");

const timeline =
    document.getElementById("timeline");

const currentTime =
    document.getElementById("currentTime");

const label =
    document.getElementById("buttonLabel");


/* PLAY / PAUSE */

playButton.addEventListener("click", function() {

    if (audio.paused) {

        audio.play();

        playButton.classList.add("playing");

        label.textContent = "Paus";

    } else {

        audio.pause();

        playButton.classList.remove("playing");

        label.textContent = "Spela upp";

    }

});


/* RESTART */

restart.addEventListener("click", function() {

    audio.currentTime = 0;

    updateProgress();

    audio.play();

    playButton.classList.add("playing");

    label.textContent = "Paus";

});


/* UPDATE PLAYER */

audio.addEventListener("timeupdate", updateProgress);


function updateProgress() {

    if (!audio.duration) {
        return;
    }

    const percent =
        (audio.currentTime / audio.duration) * 100;

    progress.style.width =
        percent + "%";

    scrubber.style.left =
        percent + "%";

    currentTime.textContent =
        formatTime(audio.currentTime);


    const played =
        Math.floor(
            (percent / 100) * bars.length
        );

    bars.forEach(function(bar, index) {

        if (index < played) {
            bar.classList.add("played");
        } else {
            bar.classList.remove("played");
        }

    });

}


/* FORMAT TIME */

function formatTime(seconds) {

    if (!isFinite(seconds)) {
        return "0:00";
    }

    const minutes =
        Math.floor(seconds / 60);

    const secs =
        Math.floor(seconds % 60)
        .toString()
        .padStart(2, "0");

    return minutes + ":" + secs;

}


/* CLICK / DRAG TIMELINE */

timeline.addEventListener("pointerdown", function(event) {

    if (!audio.duration) {
        return;
    }

    const rect =
        timeline.getBoundingClientRect();

    let percent =
        (event.clientX - rect.left) /
        rect.width;

    percent =
        Math.max(0, Math.min(1, percent));

    audio.currentTime =
        percent * audio.duration;

    updateProgress();

});


/* RECORDING FINISHED */

audio.addEventListener("ended", function() {

    playButton.classList.remove("playing");

    label.textContent =
        "Spela upp igen";

});


/* LOAD AUDIO DURATION */

audio.addEventListener("loadedmetadata", function() {

    const duration =
        formatTime(audio.duration);

    document.querySelector(
        ".times span:last-child"
    ).textContent = duration;

});


</script>

</body>
